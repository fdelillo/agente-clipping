[project]
name = "social-listening-api"
version = "0.1.0"
description = "API de dominio (Fase 1): captura, análisis e informes de social listening."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary,pool]",
    "pydantic-settings",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "anyio",
]

[tool.pytest.ini_options]
# Modo "auto": no hace falta decorar cada test async con
# @pytest.mark.asyncio, pytest-asyncio lo detecta solo por la firma "async
# def test_...".
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
